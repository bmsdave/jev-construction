[project]
name = "jev-construction"
version = "0.0.1"
description = "Pre-check construction documents against building rules with Jev (TypeSafe System One)"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Jev API (opt-in: pytest -m live)"]
addopts = "-m 'not live'"
